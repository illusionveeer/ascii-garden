<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>for you</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
<style>
  :root { --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; }
  body { font-family: var(--mono); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .txt { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 20px; transition: opacity 1.2s ease; }
  #hint { top: 7vh; color: #8d8794; font-size: clamp(12px, 1.5vw, 15px); letter-spacing: .04em; }
  #hint b { color: #ff9ec4; font-weight: 600; }
  #msg { top: 5vh; color: #ffe3ee; font-size: clamp(14px, 2vw, 21px); line-height: 1.7; white-space: pre-line; opacity: 0;
         text-shadow: 0 0 18px rgba(255, 120, 170, .55), 0 0 4px #000; letter-spacing: .02em; }
  #msg.on { opacity: 1; }
  #msg.on::after { content: "_"; margin-left: 2px; color: #ff8fb8; animation: blink 1s steps(1) infinite; }
  .off { opacity: 0 !important; }
  @keyframes blink { 50% { opacity: 0; } }

  #bq { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 94vw;
        display: flex; align-items: center; gap: 10px; padding: 7px 12px; border: 1px solid rgba(255, 160, 200, .22); border-radius: 10px;
        background: rgba(10, 8, 12, .78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        font-size: 11px; letter-spacing: .04em; color: #9a93a3; opacity: 0; pointer-events: none; transition: opacity .8s; }
  #bq.on { opacity: 1; pointer-events: auto; }
  #chips { white-space: nowrap; display: flex; flex-wrap: wrap; gap: 3px 10px; justify-content: center; }
  #chips span { white-space: nowrap; font-weight: 600; }
  #chips i { font-style: normal; opacity: .65; margin-left: 2px; font-weight: 400; }
  #send { font: inherit; font-weight: 600; color: #1a0710; background: #ff9ec4; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
          white-space: nowrap; display: none; }
  #send.on { display: block; }
  #send:active { transform: scale(.96); }

  #sig { position: fixed; right: 12px; bottom: calc(7px + env(safe-area-inset-bottom)); font-size: 9.5px; letter-spacing: .12em;
         color: #fff; opacity: .32; pointer-events: none; }
  #again { position: fixed; left: 8px; bottom: calc(3px + env(safe-area-inset-bottom)); font: inherit; font-size: 10px; letter-spacing: .1em;
           color: #fff; opacity: 0; background: none; border: 0; padding: 4px; cursor: pointer; transition: opacity 1s; pointer-events: none; }
  #again.on { opacity: .4; pointer-events: auto; }
  #again.on:hover { opacity: .9; }
</style>
</head>
<body>
<canvas id="c" aria-label="An ASCII garden. Tap a pot to grow a flower, tap a flower to pick it."></canvas>
<div id="hint" class="txt">// <b>tap a pot</b> &mdash; watch it grow</div>
<div id="msg" class="txt"></div>
<div id="bq"><div id="chips"></div><button id="send">send to veer &hearts;</button></div>
<button id="again">&#8635; start over</button>
<div id="sig">made by veer</div>

<script>
/* ───────── edit me ───────── */
const CONFIG = {
  name: "Khushi",                       // used in the email subject
  mailTo: "helloitsveer@gmail.com",     // where her bouquet gets emailed
  to: "",
  message: [
    "someone told me you like flowers,",
    "so this is for you.",
    "i grew you a whole garden. \u2665"
  ]
};
/* ─────────────────────────── */

const RAMP = " .:;i1tfLCG08@".split("");
const GLYPHS = "{}()<>=/;+*[]#$&!?".split("");
const FONT = '"SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace';
const SNIPPETS = [
  "const love = Infinity;", "while (true) { bloom(); }", "for (const petal of flower) petal.open();",
  "water(roots); sun(leaves);", "if (you.smile) garden.grow();", "return heart;",
  "function grow(seed) { return seed + time + care; }", "let us = you + me;", "// made with love",
  "flower.color = sunrise();", "await spring();", "heart.push(you);", "import { sunshine } from 'you';",
  "git commit -m 'more flowers'", "seed.plant().then(bloom);", "petals.map(p => p.unfold());",
  "try { forget(you) } catch { never }", "0xFFB6C1", "garden++", "you === home", "<3", "stem.reach(sky);",
  "bouquet.add(favourite);", "pick(flower) && regrow();"
];
const BG_PAL = [[80, 210, 160], [120, 150, 255], [255, 120, 175], [215, 180, 95], [160, 110, 255]];
const TAU = Math.PI * 2;
// her name, drifting through the code in different scripts
const NAMES = ["Khushi", "खुशी", "ખુશી", "ਖੁਸ਼ੀ", "খুশি", "خوشی", "குஷி", "ఖుషి", "クシ", "쿠시", "Кхуши", "khushi", "KHUSHI"];
let nameDrift = [];
function newName(init) {
  const dir = Math.random() < .5 ? 1 : -1;
  return { text: pick(NAMES), dir, v: rnd(8, 26), x: init ? rnd(W) : (dir > 0 ? -80 : W + 80), y: Math.floor(rnd(rows)) * chh, a: rnd(.16, .42), c: pick(BG_PAL) };
}

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const buf = document.createElement("canvas"), b = buf.getContext("2d", { willReadFrequently: true });
const $ = id => document.getElementById(id);
const hintEl = $("hint"), msgEl = $("msg"), againEl = $("again"), bqEl = $("bq"), chipsEl = $("chips"), sendEl = $("send");

let W, H, dpr, fs, cw, chh, cols, rows;
let bgCh, bgA, bgC, colGlitch;
let hStreams = [], vStreams = [], flowers = [], parts = [], fly = [], gardenRows = [];
let allDone = false, msgToken = 0, hoverI = -1, picks = {}, hintStage = 0;

const clamp = (v, a = 0, z = 1) => v < a ? a : v > z ? z : v;
const rnd = (a = 1, z) => z === undefined ? Math.random() * a : a + Math.random() * (z - a);
const pick = a => a[(Math.random() * a.length) | 0];
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function hash(i, s) { let h = Math.imul(i, 374761393) + Math.imul(s, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const colCache = new Array(32768);
function col(r, g, bl) {
  r = r > 255 ? 255 : r | 0; g = g > 255 ? 255 : g | 0; bl = bl > 255 ? 255 : bl | 0;
  const k = ((r >> 3) << 10) | ((g >> 3) << 5) | (bl >> 3);
  return colCache[k] || (colCache[k] = `rgb(${r | 7},${g | 7},${bl | 7})`);
}

/* ───────── the ten flowers ───────── */
const KINDS = {
  lavender:  { name: "lavender",  head: "spike", accent: [190, 150, 255], dark: "#2c1260", mid: "#7a4fd8", light: "#d9c2ff" },
  sunflower: { name: "sunflower", head: "daisy", accent: [255, 214, 70],  n: 16, w: .25, base: "#6e3a00", tip: "#ffe95a", back: "#3d2000", backTip: "#b87a08", core: .42, cs: ["#2e1505", "#6b3d10", "#b9791c"] },
  hydrangea: { name: "hydrangea", head: "ball",  accent: [120, 170, 255], dark: "#122a78", mid: "#3f74e8", light: "#bcd6ff" },
  lily:      { name: "lily",      head: "daisy", accent: [255, 165, 90],  n: 6,  w: .4,  base: "#8a2a00", tip: "#ffc890", back: "#4d1500", backTip: "#d86a20", core: .16, cs: ["#f8ffb0", "#b8d840", "#5a7a10"] },
  cosmos:    { name: "cosmos",    head: "daisy", accent: [205, 150, 255], n: 8,  w: .62, base: "#43168a", tip: "#e9b8ff", back: "#260b50", backTip: "#7a3fc0", core: .22, cs: ["#fff07a", "#f5b82a", "#b06a00"] },
  poppy:     { name: "poppy",     head: "daisy", accent: [255, 95, 50],   n: 5,  w: .95, base: "#7a1200", tip: "#ff7a40", back: "#420800", backTip: "#c83210", core: .24, cs: ["#3a3a3a", "#1c1c1c", "#4a2a00"] },
  daisy:     { name: "daisy",     head: "daisy", accent: [255, 255, 255], n: 13, w: .3,  base: "#5d5674", tip: "#ffffff", back: "#35304a", backTip: "#8f88a8", core: .3,  cs: ["#fff07a", "#f2b21c", "#b87400"] },
  rose:      { name: "rose",      head: "rose",  accent: [255, 80, 110],  dark: "#5e0716", mid: "#c4122f", light: "#ff6a7e" },
  blossom:   { name: "cherry blossom", head: "daisy", accent: [255, 190, 215], n: 5, w: .78, base: "#b0507a", tip: "#ffe6f0", back: "#6a2848", backTip: "#e09ab8", core: .2, cs: ["#ff5a9a", "#d02a70", "#7a1040"] },
  tulip:     { name: "tulip",     head: "tulip", accent: [255, 120, 185], dark: "#480524", mid: "#d42a78", light: "#ffb0d6" }
};
const ORDER = ["lavender", "sunflower", "hydrangea", "lily", "cosmos", "poppy", "daisy", "rose", "blossom", "tulip"];
const HEIGHTS = [.8, 1, .72, .95, .78, .9, .72, 1, .82, .92];

function petalRing(c, n, len, wid, rot, c0, c1, inner) {
  for (let i = 0; i < n; i++) {
    c.save(); c.rotate(rot + i / n * TAU);
    const g = c.createLinearGradient(inner, 0, inner + len, 0);
    g.addColorStop(0, c0); g.addColorStop(1, c1);
    c.fillStyle = g; c.beginPath(); c.ellipse(inner + len / 2, 0, len / 2, wid / 2, 0, 0, TAU); c.fill();
    c.restore();
  }
}
function blob(c, x, y, r, lx, ly, p) {
  const g = c.createRadialGradient(x + lx * r, y + ly * r, r * .05, x, y, r);
  g.addColorStop(0, p.light); g.addColorStop(.45, p.mid); g.addColorStop(1, p.dark);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
const HEADS = {
  daisy(c, R, bud, open, p, t) {
    const len = R * (.14 * bud + .8 * open), inner = R * .08, rot = t * .05 - Math.PI / 2;
    petalRing(c, p.n, len * .9, len * p.w, rot + Math.PI / p.n, p.back, p.backTip, inner);
    petalRing(c, p.n, len, len * p.w, rot, p.base, p.tip, inner);
    const cr = R * p.core * (.5 * bud + .5 * open);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, cr);
    g.addColorStop(0, p.cs[0]); g.addColorStop(.6, p.cs[1]); g.addColorStop(1, p.cs[2]);
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, cr, 0, TAU); c.fill();
  },
  rose(c, R, bud, open, p) {
    const s = R * (.3 * bud + .62 * open), sp = .35 + .65 * open;
    [[6, .62, .52], [5, .42, .46], [4, .24, .36], [3, .1, .26]].forEach(([n, d, r], k) => {
      for (let i = 0; i < n; i++) {
        const a = k * .7 + i / n * TAU;
        blob(c, Math.cos(a) * d * s * sp, Math.sin(a) * d * s * sp, r * s, Math.cos(a) * .7, Math.sin(a) * .7, p);
      }
    });
    c.fillStyle = p.light; c.beginPath(); c.arc(0, 0, s * .07, 0, TAU); c.fill();
  },
  tulip(c, R, bud, open, p) {
    const s = R * (.4 * bud + .6 * open), hgt = s * 1.55, wid = s * .4, spread = .1 + .4 * open;
    c.translate(0, s * .35);
    const petal = (ang, c0, c1) => {
      c.save(); c.rotate(ang);
      const g = c.createLinearGradient(0, 0, 0, -hgt);
      g.addColorStop(0, c0); g.addColorStop(1, c1);
      c.fillStyle = g; c.beginPath(); c.ellipse(0, -hgt * .5, wid, hgt * .5, 0, 0, TAU); c.fill(); c.restore();
    };
    petal(-spread * 1.7, p.dark, p.mid); petal(spread * 1.7, p.dark, p.mid);
    petal(-spread * .8, p.dark, p.light); petal(spread * .8, p.mid, p.light);
    petal(0, p.mid, "#fff0f7");
  },
  spike(c, R, bud, open, p) {
    const hgt = R * (.5 * bud + 1.7 * open), n = 10;
    for (let k = 0; k < n; k++) {
      const t = k / (n - 1), side = k % 2 ? 1 : -1, r = R * (.27 - .15 * t) * (.45 + .55 * open) + R * .03 * bud;
      blob(c, side * r * .75, R * .25 - t * hgt, r, side * .5, -.5, p);
    }
  },
  ball(c, R, bud, open, p) {
    const s = R * (.3 * bud + .64 * open), n = 17;
    for (let k = n - 1; k >= 0; k--) {
      const a = k * 2.4, d = Math.sqrt(k / n) * s * .78;
      blob(c, Math.cos(a) * d, Math.sin(a) * d, s * .3, -.45, -.5, p);
    }
  }
};

function stemPoint(f, t, time) {
  const S = f.S, sway = Math.sin(time * .9 + f.phase) * S * .07 * f.g + f.wig * Math.sin(time * 11) * S * .12;
  const x0 = f.x, y0 = f.potTop + 2, x1 = f.x + f.bend * S, y1 = f.potTop - f.hs * .5, x2 = f.x + f.lean * S + sway, y2 = f.potTop - f.hs;
  const u = 1 - t;
  return {
    x: u * u * x0 + 2 * u * t * x1 + t * t * x2, y: u * u * y0 + 2 * u * t * y1 + t * t * y2,
    a: Math.atan2(2 * u * (y1 - y0) + 2 * t * (y2 - y1), 2 * u * (x1 - x0) + 2 * t * (x2 - x1))
  };
}

function drawPot(c, f, i, time) {
  const tw = f.S, bw = tw * .68, rimH = f.potH * .24, x = f.x, top = f.potTop;
  let g = c.createLinearGradient(x - tw / 2, 0, x + tw / 2, 0);
  g.addColorStop(0, "#8a4326"); g.addColorStop(.3, "#f0976a"); g.addColorStop(.65, "#c4633a"); g.addColorStop(1, "#5c2a16");
  c.fillStyle = g; c.beginPath();
  c.moveTo(x - tw * .46, top + rimH); c.lineTo(x + tw * .46, top + rimH); c.lineTo(x + bw / 2, f.ground); c.lineTo(x - bw / 2, f.ground); c.closePath(); c.fill();
  c.fillStyle = "rgba(40,14,6,.55)"; c.fillRect(x - tw * .46, top + rimH, tw * .92, rimH * .45);
  g = c.createLinearGradient(x - tw * .55, 0, x + tw * .55, 0);
  g.addColorStop(0, "#a85432"); g.addColorStop(.3, "#ffb890"); g.addColorStop(.7, "#d87448"); g.addColorStop(1, "#70341c");
  c.fillStyle = g; c.fillRect(x - tw * .55, top, tw * 1.1, rimH);
  if (!VIEW && f.g === 0 && !f.growing) {
    c.fillStyle = `rgba(255,225,205,${.1 + .1 * Math.sin(time * 3 + i) + (hoverI === i ? .16 : 0)})`;
    c.fillRect(x - tw * .55, top, tw * 1.1, f.potH);
  }
}

function drawFlower(c, f, time) {
  if (f.g <= 0) return;
  const S = f.S, L = easeOut(clamp(f.g / .6));
  const sw = Math.max(S * .08, cw * 1.35);
  c.lineCap = "round"; c.lineJoin = "round";
  for (const [wd, color, off] of [[sw, "#1c6a2c", 0], [sw * .45, "#63d873", -sw * .18]]) {
    c.strokeStyle = color; c.lineWidth = wd; c.beginPath();
    for (let k = 0; k <= 18; k++) { const p = stemPoint(f, L * k / 18, time); k ? c.lineTo(p.x + off, p.y) : c.moveTo(p.x + off, p.y); }
    c.stroke();
  }
  for (const lf of f.leaves) {
    const lp = clamp((L - lf.t) / .25); if (lp <= 0) continue;
    const p = stemPoint(f, lf.t, time), len = S * .95 * lf.size * easeBack(lp), w = len * .36;
    c.save(); c.translate(p.x, p.y); c.rotate(p.a + lf.side * (.95 + Math.sin(time * 1.1 + lf.t * 9) * .06));
    const g = c.createLinearGradient(0, -w * .6, 0, w * .6);
    g.addColorStop(0, "#86ec8e"); g.addColorStop(.55, "#2f9a44"); g.addColorStop(1, "#14561f");
    c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * .45, -w, len, 0); c.quadraticCurveTo(len * .55, w * .8, 0, 0); c.fill();
    c.restore();
  }
  const bud = clamp((f.g - .42) / .2), open = easeInOut(clamp((f.g - .6) / .4));
  if (bud > 0) {
    const tip = stemPoint(f, L, time);
    c.save(); c.translate(tip.x, tip.y); c.rotate(Math.sin(time * .7 + f.phase) * .07 + f.wig * Math.sin(time * 11) * .25);
    HEADS[f.pal.head](c, f.headR, easeOut(bud), open, f.pal, time);
    c.restore();
  }
}

function drawGrass(c, row, time) {
  c.lineCap = "round"; c.lineWidth = cw * 1.1;
  for (const t of row.tufts) {
    const sway = Math.sin(time * 1.3 + t.ph) * t.h * .18;
    for (let k = -1; k <= 1; k++) {
      c.strokeStyle = k ? "#2c8a3c" : "#62d470"; c.beginPath();
      c.moveTo(t.x + k * 1.5, row.ground); c.lineTo(t.x + k * t.h * .4 + sway, row.ground - t.h * (k ? .7 : 1)); c.stroke();
    }
  }
}

/* ───────── layout ───────── */
function layout() {
  const counts = W >= 820 ? [5, 5] : [3, 4, 3];
  const top = H * .15, bottom = H - 122, band = (bottom - top) / counts.length;
  if (!flowers.length) flowers = ORDER.map((k, i) => ({
    kind: k, pal: KINDS[k], g: 0, growing: false, bloomed: false, glow: 0, wig: 0, phase: rnd(TAU),
    bend: rnd(-.5, .5), lean: rnd(-.22, .22),
    leaves: [{ t: .26, side: i % 2 ? 1 : -1, size: 1 }, { t: .46, side: i % 2 ? -1 : 1, size: .85 }, { t: .66, side: i % 2 ? 1 : -1, size: .6 }]
  }));
  gardenRows = []; let i = 0;
  counts.forEach((n, r) => {
    const slot = W / n, ground = top + band * (r + 1), row = { ground, list: [], tufts: [] };
    const shift = counts.length === 2 ? (r ? .16 : -.16) * slot : 0;
    for (let j = 0; j < n; j++, i++) {
      const f = flowers[i]; row.list.push(f);
      f.slot = slot; f.x = slot * (j + .5) + shift; f.ground = ground;
      f.S = Math.min(slot * .5, band * .24); f.potH = f.S * .85; f.potTop = ground - f.potH;
      f.headR = Math.min(slot * .4, band * .2);
      f.hs = (band - 22 - f.potH - f.headR * 1.15) * HEIGHTS[i] * (f.pal.head === "spike" ? .62 : 1);
    }
    const S = row.list[0].S;
    for (let x = rnd(6, 20); x < W; x += rnd(14, 34))
      if (!row.list.some(f => Math.abs(f.x - x) < f.S * .62)) row.tufts.push({ x, h: S * rnd(.18, .4), ph: rnd(TAU) });
    gardenRows.push(row);
  });
}

function newH(init) {
  const text = pick(SNIPPETS), dir = Math.random() < .5 ? 1 : -1;
  return { row: (rnd(rows)) | 0, dir, speed: rnd(1.5, 8), text, x: init ? rnd(-text.length, cols) : (dir > 0 ? -text.length : cols), a: rnd(.1, .26), c: (rnd(BG_PAL.length)) | 0 };
}
function newV(init) {
  const text = pick(SNIPPETS);
  return { col: (rnd(cols)) | 0, y: init ? rnd(rows + text.length) : 0, speed: rnd(4, 13), text, a: rnd(.14, .32), c: (rnd(BG_PAL.length)) | 0 };
}

function resize() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  fs = clamp(W / 130, 7.5, 11); cw = fs * .6; chh = fs * 1.08;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / chh);
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buf.width = cols; buf.height = rows;
  const n = cols * rows;
  bgCh = new Uint16Array(n); bgA = new Float32Array(n); bgC = new Uint8Array(n); colGlitch = new Float32Array(cols);
  hStreams = Array.from({ length: Math.round(rows / 2.8) }, () => newH(true));
  vStreams = Array.from({ length: Math.round(cols / 9) }, () => newV(true));
  nameDrift = Array.from({ length: clamp(Math.round(W * H / 70000), 7, 16) }, () => newName(true));
  layout();
}

/* ───────── particles ───────── */
function spawnIn(f, time) {
  const tip = stemPoint(f, easeOut(clamp(f.g / .6)), time), a = rnd(TAU), r = f.headR * rnd(1.6, 4);
  parts.push({ type: 0, sx: tip.x + Math.cos(a) * r, sy: tip.y + Math.sin(a) * r * .8, tx: tip.x, ty: tip.y, life: 0, max: rnd(.5, 1.1), ch: pick(GLYPHS), c: f.pal.accent });
}
function burst(x, y, accent, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), v = rnd(30, 150) * power;
    parts.push({ type: 1, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: 0, max: rnd(1.2, 2.4), ch: Math.random() < .45 ? "♥" : pick(["*", "+", ".", "o", "'"]), c: Math.random() < .5 ? accent : [255, 150, 190] });
  }
}

/* ───────── hints + bouquet ───────── */
const HINTS = [
  "// <b>tap a pot</b> &mdash; watch it grow",
  "// keep going &mdash; <b>plant the whole garden</b>",
  "// now <b>tap a flower to pick it</b> &hearts; it grows back"
];
function setHint(n) { if (n > hintStage) { hintStage = n; hintEl.innerHTML = HINTS[n]; } }
function updateBar() {
  const ks = Object.keys(picks);
  if (!ks.length) { chipsEl.textContent = "pick the ones you love ↑"; sendEl.classList.remove("on"); }
  else {
    chipsEl.innerHTML = "<span style='color:#9a93a3;font-weight:400'>bouquet:</span>" +
      ks.map(k => `<span style="color:rgb(${KINDS[k].accent})">${KINDS[k].name}<i>×${picks[k]}</i></span>`).join("");
    sendEl.classList.add("on");
  }
  bqEl.classList.add("on");
}
function bouquetText() {
  const ks = Object.keys(picks).sort((a, c) => picks[c] - picks[a]), max = picks[ks[0]];
  const favs = ks.filter(k => picks[k] === max).map(k => KINDS[k].name);
  return "my bouquet 💐\n" + ks.map(k => `${picks[k]} × ${KINDS[k].name}`).join("\n") + `\n\nfavourite: ${favs.join(" & ")} ♥`;
}
let sending = false;
sendEl.addEventListener("click", async () => {
  if (sending) return; sending = true;
  const ks = Object.keys(picks).sort((a, c) => picks[c] - picks[a]), max = picks[ks[0]];
  const favs = ks.filter(k => picks[k] === max).map(k => KINDS[k].name);
  const link = location.origin + location.pathname + "?b=" + ks.map(k => k + "." + picks[k]).join("-");
  sendEl.textContent = "sending\u2026";
  try {
    const r = await fetch("https://formsubmit.co/ajax/" + CONFIG.mailTo, {
      method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        _subject: `\ud83d\udc90 ${CONFIG.name} picked a bouquet for you`, _template: "box", _captcha: "false",
        "a little note": `${CONFIG.name} walked through your garden and picked these \u2665`,
        "her favourite": favs.join(" & "),
        "her bouquet": ks.map(k => `${picks[k]} \u00d7 ${KINDS[k].name}`).join(",  "),
        "watch her bouquet bloom": link
      })
    });
    if (!r.ok) throw new Error("mail failed");
    sendEl.textContent = "sent to veer \u2665"; burst(W / 2, H - 62, [255, 130, 175], 40);
  } catch (e) {
    const text = bouquetText();
    if (navigator.share) { try { await navigator.share({ text }); } catch (e2) {} }
    else { try { await navigator.clipboard.writeText(text); sendEl.textContent = "copied \u2713 paste it to veer"; } catch (e2) { sendEl.textContent = "screenshot this for veer \u2665"; } }
  }
  setTimeout(() => { sending = false; sendEl.innerHTML = "send to veer &hearts;"; }, 4000);
});

// opened from the email link (?b=rose.2-tulip.1): just show the bouquet she picked
const VIEW = (() => {
  const m = new URLSearchParams(location.search).get("b"); if (!m) return null;
  const o = {}; m.split("-").forEach(t => { const [k, n] = t.split("."); if (KINDS[k]) o[k] = clamp(parseInt(n) || 1, 1, 99); });
  return Object.keys(o).length ? o : null;
})();

/* ───────── interaction ───────── */
function flowerAt(x, y) {
  let best = -1, bd = 1e9;
  flowers.forEach((f, i) => {
    const topY = f.potTop - (f.g > 0 ? f.hs + f.headR * 1.6 : f.S * .6);
    const dy = y < topY ? topY - y : y > f.ground ? y - f.ground : 0, d = Math.hypot((x - f.x) * 1.4, dy);
    if (d < bd && d < f.slot * .6) { bd = d; best = i; }
  });
  return best;
}
cv.addEventListener("pointermove", e => { hoverI = flowerAt(e.clientX, e.clientY); cv.style.cursor = hoverI >= 0 ? "pointer" : "default"; });
cv.addEventListener("pointerleave", () => hoverI = -1);
cv.addEventListener("pointerdown", e => {
  const i = flowerAt(e.clientX, e.clientY); if (i < 0 || VIEW) return;
  const f = flowers[i], time = performance.now() / 1000;
  if (f.g >= 1) {                                   // pick it → flies to the bouquet, regrows
    const tip = stemPoint(f, 1, time);
    fly.push({ f, x0: tip.x, y0: tip.y, t: 0 });
    burst(tip.x, tip.y, f.pal.accent, 14, .6);
    f.g = .42; f.growing = true; f.wig = 1;
  } else if (!f.growing) { f.growing = true; setHint(1); }
});
againEl.addEventListener("click", () => {
  flowers.forEach(f => { f.g = 0; f.growing = false; f.bloomed = false; f.glow = 0; });
  allDone = false; msgToken++; picks = {}; fly = []; hintStage = -1;
  msgEl.classList.remove("on"); againEl.classList.remove("on"); bqEl.classList.remove("on");
  setTimeout(() => { msgEl.textContent = ""; setHint(0); hintEl.classList.remove("off"); }, 900);
});
addEventListener("resize", resize);

async function typeMessage() {
  const my = ++msgToken, text = (CONFIG.to ? `for ${CONFIG.to},\n` : "") + CONFIG.message.join("\n");
  hintEl.classList.add("off"); msgEl.textContent = ""; msgEl.classList.add("on");
  for (const ch of text) {
    if (my !== msgToken) return;
    msgEl.textContent += ch;
    await new Promise(r => setTimeout(r, ch === "\n" ? 420 : 48));
  }
  againEl.classList.add("on");
}

/* ───────── loop ───────── */
let last = 0, heartT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 30) return;
  const dt = Math.min((now - last) / 1000, .06), time = now / 1000; last = now;

  // update
  for (const f of flowers) {
    if (f.growing) {
      f.g = Math.min(1, f.g + dt / 5.5); f.glow = 1;
      if (Math.random() < .9) spawnIn(f, time);
      if (f.g >= 1) {
        f.growing = false; const tip = stemPoint(f, 1, time); burst(tip.x, tip.y, f.pal.accent, f.bloomed ? 16 : 36);
        if (!f.bloomed) { f.bloomed = true; if (VIEW) continue; setHint(2); if (!bqEl.classList.contains("on")) updateBar(); }
      }
    } else f.glow = Math.max(f.g >= 1 ? .03 : 0, f.glow - dt * .8);
    f.wig = Math.max(0, f.wig - dt * 1.3);
  }
  if (!VIEW && !allDone && flowers.every(f => f.bloomed)) { allDone = true; setTimeout(typeMessage, 700); }
  if (allDone && (heartT -= dt) < 0) {
    heartT = rnd(.3, .8); const f = pick(flowers), tip = stemPoint(f, 1, time);
    parts.push({ type: 1, x: tip.x + rnd(-f.headR, f.headR), y: tip.y, vx: rnd(-12, 12), vy: rnd(-45, -20), life: 0, max: rnd(2.5, 4), ch: "♥", c: [255, 130, 175], float: 1 });
  }

  // scene → low-res buffer
  b.setTransform(1, 0, 0, 1, 0, 0); b.fillStyle = "#000"; b.fillRect(0, 0, cols, rows);
  b.setTransform(1 / cw, 0, 0, 1 / chh, 0, 0);
  const sg = b.createLinearGradient(0, 0, W, 0);
  sg.addColorStop(0, "#000"); sg.addColorStop(.12, "#3c4a30"); sg.addColorStop(.88, "#3c4a30"); sg.addColorStop(1, "#000");
  for (const row of gardenRows) {
    b.fillStyle = sg; b.fillRect(0, row.ground, W, chh);
    drawGrass(b, row, time);
    for (const f of row.list) drawFlower(b, f, time);
    for (const f of row.list) drawPot(b, f, flowers.indexOf(f), time);
  }
  for (let i = fly.length - 1; i >= 0; i--) {          // picked flowers flying into the bouquet
    const p = fly[i]; p.t += dt / .95;
    const e = easeInOut(clamp(p.t)), tx = W / 2, ty = H - 62;
    const x = p.x0 + (tx - p.x0) * e, y = p.y0 + (ty - p.y0) * e - Math.sin(e * Math.PI) * H * .1;
    b.save(); b.translate(x, y); b.rotate(e * 2.5);
    HEADS[p.f.pal.head](b, p.f.headR * (1 - .55 * e), 1, 1, p.f.pal, time); b.restore();
    if (p.t >= 1) { fly.splice(i, 1); picks[p.f.kind] = (picks[p.f.kind] || 0) + 1; updateBar(); burst(tx, ty, p.f.pal.accent, 10, .5); }
  }
  const px = b.getImageData(0, 0, cols, rows).data;

  // background code
  bgA.fill(0);
  for (let s = 0; s < hStreams.length; s++) {
    const h = hStreams[s]; h.x += h.dir * h.speed * dt;
    if (h.x > cols || h.x < -h.text.length) { hStreams[s] = newH(false); continue; }
    const x0 = Math.floor(h.x), base = h.row * cols;
    for (let k = 0; k < h.text.length; k++) {
      const cx = x0 + k; if (cx < 0 || cx >= cols) continue;
      const code = h.text.charCodeAt(k); if (code === 32) continue;
      if (h.a > bgA[base + cx]) { bgA[base + cx] = h.a; bgCh[base + cx] = code; bgC[base + cx] = h.c; }
    }
  }
  for (let s = 0; s < vStreams.length; s++) {
    const v = vStreams[s], len = v.text.length; v.y += v.speed * dt;
    if (v.y - len > rows) { vStreams[s] = newV(false); continue; }
    const y0 = Math.floor(v.y);
    for (let j = 0; j < len; j++) {
      const cy = y0 - j; if (cy < 0 || cy >= rows) continue;
      const code = v.text.charCodeAt(len - 1 - j); if (code === 32) continue;
      const a = j === 0 ? v.a * 2 : v.a * (1 - j / len), i = cy * cols + v.col;
      if (a > bgA[i]) { bgA[i] = a; bgCh[i] = code; bgC[i] = v.c; }
    }
  }

  // compose
  ctx.fillStyle = "#050506"; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "top"; ctx.textAlign = "center"; ctx.font = `600 ${fs + 1}px ${FONT}`;
  for (let i = 0; i < nameDrift.length; i++) {
    const n = nameDrift[i]; n.x += n.dir * n.v * dt;
    if (n.x < -100 || n.x > W + 100) { nameDrift[i] = newName(false); continue; }
    ctx.fillStyle = col(n.c[0] * n.a, n.c[1] * n.a, n.c[2] * n.a); ctx.fillText(n.text, n.x, n.y);
  }
  ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = "left";
  const seed = Math.floor(time * 6), RL = RAMP.length;
  const gz = flowers.filter(f => f.glow > 0).map(f => [f.x - f.headR * 1.3, f.x + f.headR * 1.3, f.potTop - f.hs - f.headR * 2.2, f.ground, f.glow]);
  for (let y = 0; y < rows; y++) {
    const py = y * chh;
    colGlitch.fill(0);
    for (const z of gz) if (py >= z[2] && py <= z[3]) for (let x = Math.max(0, z[0] / cw | 0), e = Math.min(cols - 1, z[1] / cw | 0); x <= e; x++) colGlitch[x] = z[4];
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x, o = i * 4, r = px[o], g = px[o + 1], bl = px[o + 2];
      const m = r > g ? (r > bl ? r : bl) : (g > bl ? g : bl);
      if (m > 24) {
        const lum = m / 255, h = hash(i, seed);
        let idx = 1 + Math.floor(Math.pow(lum, 1.5) * (RL - 1.001));
        if (h < .1) idx += h < .05 ? 1 : -1;
        idx = idx < 1 ? 1 : idx >= RL ? RL - 1 : idx;
        const ch = h > 1 - colGlitch[x] * .3 ? GLYPHS[(h * 9973 | 0) % GLYPHS.length] : RAMP[idx];
        const k = (.5 + .5 * lum) * 255 / m;
        ctx.fillStyle = col(r * k, g * k, bl * k);
        ctx.fillText(ch, x * cw, py);
      } else if (bgA[i] > .02) {
        const p = BG_PAL[bgC[i]], a = bgA[i];
        ctx.fillStyle = col(p[0] * a, p[1] * a, p[2] * a);
        ctx.fillText(String.fromCharCode(bgCh[i]), x * cw, py);
      }
    }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    const t = p.life / p.max; if (t >= 1) { parts.splice(i, 1); continue; }
    let x, y, a;
    if (p.type === 0) { const e = t * t; x = p.sx + (p.tx - p.sx) * e; y = p.sy + (p.ty - p.sy) * e; a = Math.min(1, t * 3); }
    else {
      if (!p.float) { p.vx *= 1 - dt * 1.6; p.vy = p.vy * (1 - dt * 1.6) - 14 * dt; } else p.vx += Math.sin(time * 2 + p.max * 9) * 20 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; x = p.x; y = p.y; a = Math.min(1, t * 6) * (1 - t);
    }
    ctx.fillStyle = col(p.c[0] * a, p.c[1] * a, p.c[2] * a);
    ctx.fillText(p.ch, Math.floor(x / cw) * cw, Math.floor(y / chh) * chh);
  }

  // labels: "tap" on empty pots, the flower's name once it has bloomed
  ctx.textAlign = "center";
  flowers.forEach((f, i) => {
    if (VIEW && f.g === 0) return;
    if (f.g === 0 && !f.growing) {
      ctx.font = `600 ${Math.max(10, fs + 1)}px ${FONT}`;
      ctx.fillStyle = `rgba(255,170,205,${.45 + .35 * Math.sin(time * 3 + i)})`;
      ctx.fillText("tap", f.x, f.potTop - 18 + Math.sin(time * 3 + i) * 3);
    } else if (f.bloomed) {
      ctx.font = `600 ${Math.max(9, fs)}px ${FONT}`;
      const a = f.pal.accent, tw = ctx.measureText(f.pal.name).width + 8;
      ctx.fillStyle = "rgba(5,5,6,.8)"; ctx.fillRect(f.x - tw / 2, f.ground + chh + 1, tw, Math.max(9, fs) + 4);
      ctx.fillStyle = `rgba(${a[0]},${a[1]},${a[2]},${hoverI === i ? 1 : .75})`;
      ctx.fillText(f.pal.name, f.x, f.ground + chh + 3);
    }
  });
}

resize();
if (VIEW) {
  const ks = Object.keys(VIEW).sort((a, c) => VIEW[c] - VIEW[a]), favs = ks.filter(k => VIEW[k] === VIEW[ks[0]]).map(k => KINDS[k].name);
  hintEl.classList.add("off"); cv.style.cursor = "default";
  msgEl.textContent = `${CONFIG.name.toLowerCase()}'s bouquet, picked for you \u2665\n` + ks.map(k => `${VIEW[k]} \u00d7 ${KINDS[k].name}`).join(" \u00b7 ") + `\nfavourite: ${favs.join(" & ")}`;
  msgEl.classList.add("on");
  flowers.forEach((f, i) => { if (VIEW[f.kind]) setTimeout(() => f.growing = true, 600 + i * 350); });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
